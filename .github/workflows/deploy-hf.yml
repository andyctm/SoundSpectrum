name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_USERNAME: andyctm79
  HF_SPACE: SoundSpectrum

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # No GH_PAGES_BUILD env here: the Space serves from the domain root, so basePath must be empty.
      - name: Build static export
        run: npm run build

      - name: Write Space README (SDK metadata required by Hugging Face)
        run: |
          cat > out/README.md <<'EOF'
          ---
          title: SoundSpectrum
          emoji: 📊
          colorFrom: pink
          colorTo: red
          sdk: static
          pinned: false
          ---

          # Sound Frequency Analyzer

          Real-time microphone/audio-file frequency analysis (waveform, FFT spectrum,
          dominant/peak frequency, scrolling heatmap) built with Next.js and the Web Audio API.
          Source: https://github.com/${{ github.repository }}
          EOF

      - name: Push build output to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          rm -rf space-deploy
          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" space-deploy
          find space-deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r out/. space-deploy/
          cd space-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy ${GITHUB_SHA}"
            git push
          fi
